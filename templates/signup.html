<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - CollegeHub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-card {
            background: #FFF;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <span class="brand-badge" style="display:inline-block; margin-bottom: 8px;">CH</span>
                <h1 style="font-size: 22px; font-weight: 700;">Student Registration</h1>
                <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Create your student account to access projects and assignments</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, msg in messages %}
                        <div class="flash-message flash-{{ category }}">{{ msg }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('signup') }}" method="POST">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" name="full_name" placeholder="KRISHNA KAMALA PRASAD VISHWAKARMA" required class="form-input">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div class="form-group">
                        <label>Student ID / Roll No *</label>
                        <input type="text" name="student_id" placeholder="IT-2023-042" required class="form-input">
                    </div>
                    <div class="form-group">
                        <label>Department / Course *</label>
                        <select name="department" class="form-select">
                            <option value="Information Technology">Information Technology</option>
                            <option value="Computer Science">Computer Science</option>
                            <option value="Electronics & Telecomm">Electronics & Telecomm</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Year / Semester *</label>
                    <input type="text" name="year_semester" value="Year 3, Semester 5" required class="form-input">
                </div>

                <div class="form-group">
                    <label>Email Address *</label>
                    <input type="email" name="email" placeholder="student@college.edu" required class="form-input">
                </div>

                <div class="form-group">
                    <label>Password *</label>
                    <input type="password" name="password" placeholder="••••••••" required class="form-input">
                </div>

                <button type="submit" class="btn-forest full-width" style="margin-top: 10px;">Register Account &rarr;</button>
            </form>

            <div style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted);">
                Already have an account? <a href="{{ url_for('login') }}" style="color: var(--brand-forest); font-weight: 600; text-decoration: none;">Sign in here</a>
            </div>
        </div>
    </div>
</body>
</html>
